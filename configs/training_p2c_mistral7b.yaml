# P2-C: Mistral-7B-Instruct-v0.3, QLoRA on RunPod (RTX 3090/4090/A100)
#
# Base model loaded in NF4 (4-bit) to fit VRAM; LoRA adapters train in bf16.
# This is NOT the same as Mac MLX 4-bit: adapters are full precision and
# HuggingFace handles the system role natively (no user-turn merging needed).
#
# Changes vs P2-A (Qwen bf16):
#   model:   Qwen2.5-1.5B-Instruct-bf16 → Mistral-7B-Instruct-v0.3
#   r:       4 → 8   (7B has more capacity; larger rank affordable)
#   alpha:   8 → 16
#   lr:      1e-4    (start conservative; same as P2-A best)
#   steps:   150     (T4/3090 equivalent of iter75 on Mac; eval every 25)

model: "mistralai/Mistral-7B-Instruct-v0.3"
data: "data/mlx_curated_medium"
adapter_path: "outputs/adapters/p2c_mistral7b"

seed: 42
max_seq_length: 1024

# LoRA
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# Training
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
max_steps: 150
learning_rate: 1.0e-4
warmup_steps: 5
eval_steps: 25
save_steps: 25
logging_steps: 10
