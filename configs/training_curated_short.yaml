# M5-v6 training config: curated 247 samples + short system prompts.
#
# Hypothesis (per Aarhus paper §3 "Fixed Persona via Fine-Tuning"):
#   Persona behavior should be learned from user/assistant pairs alone.
#   When the long ~800-token system prompt repeats across all samples and the
#   LoRA capacity is small (M5-v5 r=4 + 247 samples), the model takes the
#   shortcut of memorizing the prompt text itself, then parrots it back on
#   jailbreak/edge-case queries.
#
# Fix in this run:
#   - data: data/mlx_curated_short  (system prompts replaced with one-liners)
#   - All other knobs identical to M5-v5 so the comparison is clean
#   - adapter_path: outputs/adapters/v6_curated_short

model: "mlx-community/Qwen2.5-1.5B-Instruct-4bit"
train: true
data: "data/mlx_curated_short"

seed: 42
fine_tune_type: "lora"

batch_size: 4
iters: 248
val_batches: 10
learning_rate: 2.0e-4
steps_per_eval: 25
steps_per_report: 10
save_every: 25

max_seq_length: 1024
grad_checkpoint: true

num_layers: -1
lora_parameters:
  rank: 4
  alpha: 8
  dropout: 0.10
  scale: 10.0
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"

adapter_path: "outputs/adapters/v6_curated_short"
