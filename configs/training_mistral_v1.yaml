# M5-Mistral-v1 training config.
#
# Goal: Definitive capacity test. After 9 checkpoints on Qwen-1.5B (best:
# in_character=3.85, jailbreak=4.60 at v7-iter75), switching to Mistral-7B
# to determine whether the in_character ceiling is a model-capacity issue.
#
# Design choices:
#   - Same data as M5-v7 (data/mlx_curated_medium, 247 samples, medium prompts)
#     to isolate model family as the only changed variable
#   - Same LoRA target modules (all 7 keys: attn + mlp)
#   - r=8 instead of r=4: 7B has more capacity, r=4 may underfit at this scale
#   - iters=248: same as v7 (4 epochs over 247 samples at batch=4)
#   - save_every=25 to capture iter75 (Qwen peak) for direct comparison
#
# Expected: ~30-45 min training on Apple Silicon (vs ~10 min for 1.5B)

model: "mlx-community/Mistral-7B-Instruct-v0.3-4bit"
train: true
data: "data/mlx_mistral"

seed: 42
fine_tune_type: "lora"

batch_size: 4
iters: 248
val_batches: 10
learning_rate: 5.0e-5
steps_per_eval: 25
steps_per_report: 10
save_every: 25

max_seq_length: 1024
grad_checkpoint: true

num_layers: -1
lora_parameters:
  rank: 8
  alpha: 16
  dropout: 0.05
  scale: 10.0
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"

adapter_path: "outputs/adapters/mistral_v1"
