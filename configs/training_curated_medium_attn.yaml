# M5-v8 training config: medium prompt + attention-only LoRA.
#
# Hypothesis: M5-v7 final showed the system-prompt memorization failure mode
# returning at iter248 — Garrick/jailbreak literally regurgitated the
# personas_medium.yaml Voice/Knowledge/Never-mention block. Shortening the
# prompt only delayed memorization, didn't prevent it.
#
# Theory: MLP layers carry "knowledge memorization" (rote text recall);
# attention layers carry voice/style transformation. Freezing MLP and only
# training attention should:
#   - prevent LoRA from acquiring the capacity to memorize the prompt text
#   - still allow voice/persona learning (attention does the heavy lifting)
#   - keep the base model's general knowledge intact (no MLP drift)
#
# All other knobs identical to M5-v7 for clean comparison.

model: "mlx-community/Qwen2.5-1.5B-Instruct-4bit"
train: true
data: "data/mlx_curated_medium"

seed: 42
fine_tune_type: "lora"

batch_size: 4
iters: 248
val_batches: 10
learning_rate: 2.0e-4
steps_per_eval: 25
steps_per_report: 10
save_every: 25

max_seq_length: 1024
grad_checkpoint: true

num_layers: -1
lora_parameters:
  rank: 4
  alpha: 8
  dropout: 0.10
  scale: 10.0
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    # MLP frozen — see header comment

adapter_path: "outputs/adapters/v8_attn_only"
