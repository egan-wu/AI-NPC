# M5-v7 training config: curated 247 + medium-length system prompt.
# Identical to M5-v6 except `data: data/mlx_curated_medium`.
# Compare against:
#   M5-v5 (long prompt): jailbreak 2.0 ❌, parrots prompt
#   M5-v6 (short prompt): jailbreak 4.6 ✅, in_char 2.5 ❌
# Hypothesis: medium prompt keeps voice cues for in_char while removing the
# "Critical refusal rule:" paragraph that v5 was memorizing.

model: "mlx-community/Qwen2.5-1.5B-Instruct-4bit"
train: true
data: "data/mlx_curated_medium"

seed: 42
fine_tune_type: "lora"

batch_size: 4
iters: 248
val_batches: 10
learning_rate: 2.0e-4
steps_per_eval: 25
steps_per_report: 10
save_every: 25

max_seq_length: 1024
grad_checkpoint: true

num_layers: -1
lora_parameters:
  rank: 4
  alpha: 8
  dropout: 0.10
  scale: 10.0
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"

adapter_path: "outputs/adapters/v7_curated_medium"
