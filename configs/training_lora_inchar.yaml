# Phase 2 LoRA Routing — LoRA_InChar adapter
#
# Trains the "in-character dialogue" half of the dual-LoRA routing system.
# This adapter handles p ≈ 0: normal medieval NPC conversation with no
# anachronistic content detected.
#
# Dataset: data/lora_inchar/  (pure in-character samples, no prefix tokens)
# Blending: at inference, scaled by (1 - p) via src/lora_router.py
#
# Hyperparameters match P2-C baseline for clean comparison. The only
# change is the dataset and adapter_path.

model: "mistralai/Mistral-7B-Instruct-v0.3"
data: "data/lora_inchar"
adapter_path: "outputs/adapters/lora_inchar"

seed: 42
max_seq_length: 1024

# LoRA — same rank/alpha as P2-C so both adapters have identical capacity
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

# Training
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
max_steps: 150
learning_rate: 1.0e-4
warmup_steps: 5
eval_steps: 25
save_steps: 25
logging_steps: 10
